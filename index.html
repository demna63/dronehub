    <script>
      (async function preloadLatestPost() {
        try {
          const projectId = "%VITE_FIREBASE_PROJECT_ID%"; 
          
          if (!projectId || projectId.includes("%")) {
            console.warn("Firebase Project ID not injected properly.");
            return;
          }
          
          const url = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/posts?orderBy=createdAt%20desc&pageSize=1`;
          const response = await fetch(url);
          const data = await response.json();
          const imageUrl = data.documents[0]?.fields?.image?.stringValue;

          if (imageUrl) {
            const link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'image';
            link.fetchpriority = 'high';
            link.href = imageUrl;
            document.head.appendChild(link);
          }
        } catch (e) {
          console.warn("LCP Preload skipped");
        }
      })();
    </script>
