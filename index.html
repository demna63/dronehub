    <!-- Fallback only. The authoritative policy is served as a real
         Content-Security-Policy response header from firebase.json — a meta CSP

    <meta 
      http-equiv="Content-Security-Policy" 
      content="

        script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https://maps.googleapis.com https://maps.gstatic.com https://www.gstatic.com https://apis.google.com https://static.cloudflareinsights.com https://*.firebaseio.com https://*.firebase.com; 
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
        font-src 'self' https://fonts.gstatic.com https://maps.gstatic.com; 
        img-src 'self' data: blob: https:; 
        connect-src 'self' data: blob: https://maps.googleapis.com https://maps.gstatic.com https://*.googleapis.com https://*.firebaseio.com https://*.firebase.com wss://*.firebaseio.com https://www.gstatic.com https://cloudflareinsights.com https://generativelanguage.googleapis.com https://api.open-meteo.com https://*.cloudfunctions.net https://*.run.app; 
        frame-src 'self' https://www.youtube.com https://youtube.com https://*.firebaseapp.com https://*.firebase.com;

      "

    <title>DroneHub Georgia — ქართული FPV და დრონების საზოგადოება</title>
    
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#020617" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The LCP image is discovered by the inline Firestore probe below; opening
         both connections during HTML parse removes ~2 RTT from the critical path. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;700;800&display=swap">
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;700;800&display=swap">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;700;800&display=swap">
    </noscript>

    <script>
      /*
       * Fetch the feed's first page over REST while the app bundle is still
       * downloading, and hand it to React (useAppData reads
       * window.__DHG_FIRST_PAGE__, or listens for "dhg:first-page" if this
       * lands after mount). Same order as the app's default query —
       * telemetryScore desc, createdAt desc — so the SDK result that follows
       * replaces these rows with identical ones and nothing moves.
       *
       * No image preload any more: the feed shows 120px thumbnails, and
       * preloading the newest post's full-size image at high priority spent
       * ~150 KB on something that is neither the LCP element nor, in the
       * rated order, necessarily the first row.
       */
      (async function preloadFirstPage() {
        try {
          const projectId = "%VITE_FIREBASE_PROJECT_ID%";
          if (!projectId || projectId.includes("%")) return;

          const url = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/posts`
            + '?orderBy=' + encodeURIComponent('telemetryScore desc, createdAt desc')
            + '&pageSize=12';
          const response = await fetch(url);
          if (!response.ok) return;
          const data = await response.json();
          if (!data.documents || data.documents.length === 0) return;

          // Decode a Firestore REST value into the same native shape the client
          // SDK's document.data() would produce.
          const decode = (v) => {
            if (v == null) return null;
            if ('stringValue' in v) return v.stringValue;
            if ('integerValue' in v) return Number(v.integerValue);
            if ('doubleValue' in v) return Number(v.doubleValue);
            if ('booleanValue' in v) return v.booleanValue;
            if ('nullValue' in v) return null;
            if ('timestampValue' in v) {
              return { seconds: Math.floor(Date.parse(v.timestampValue) / 1000), nanoseconds: 0 };
            }
            if ('mapValue' in v) {
              const out = {};
              const fields = (v.mapValue && v.mapValue.fields) || {};
              for (const key in fields) out[key] = decode(fields[key]);
              return out;
            }
            if ('arrayValue' in v) {
              return ((v.arrayValue && v.arrayValue.values) || []).map(decode);
            }
            return null;
          };

          const toPost = (document0) => {
            const fields = document0.fields || {};
            const post = { id: document0.name.split('/').pop() };
            for (const key in fields) post[key] = decode(fields[key]);
            return post;
          };

          window.__DHG_FIRST_PAGE__ = data.documents.map(toPost);
          window.dispatchEvent(new Event('dhg:first-page'));
        } catch (e) {
          // Best-effort: the app's own query still runs.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
