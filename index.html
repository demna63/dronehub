    <script>
      /*
       * Fetch the feed's first page over REST while the app bundle is still
       * downloading, and hand it to React (useAppData reads
       * window.__DHG_FIRST_PAGE__, or listens for "dhg:first-page" if this
       * lands after mount). Same order as the app's default query —
       * createdAt desc — so the SDK result that follows replaces these rows
       * with identical ones and nothing moves.
       *
       * No image preload any more: the feed shows 120px thumbnails, and
       * preloading the newest post's full-size image at high priority spent
       * ~150 KB on something that is not the LCP element.
       */
      (async function preloadFirstPage() {
        try {
          const projectId = "%VITE_FIREBASE_PROJECT_ID%";
          if (!projectId || projectId.includes("%")) return;

          const url = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/posts`
            + '?orderBy=' + encodeURIComponent('createdAt desc')
            + '&pageSize=12';
          const response = await fetch(url);
          if (!response.ok) return;
          const data = await response.json();
          if (!data.documents || data.documents.length === 0) return;

          // Decode a Firestore REST value into the same native shape the client
          // SDK's document.data() would produce.
          const decode = (v) => {
            if (v == null) return null;
            if ('stringValue' in v) return v.stringValue;
            if ('integerValue' in v) return Number(v.integerValue);
            if ('doubleValue' in v) return Number(v.doubleValue);
            if ('booleanValue' in v) return v.booleanValue;
            if ('nullValue' in v) return null;
            if ('timestampValue' in v) {
              return { seconds: Math.floor(Date.parse(v.timestampValue) / 1000), nanoseconds: 0 };
            }
            if ('mapValue' in v) {
              const out = {};
              const fields = (v.mapValue && v.mapValue.fields) || {};
              for (const key in fields) out[key] = decode(fields[key]);
              return out;
            }
            if ('arrayValue' in v) {
              return ((v.arrayValue && v.arrayValue.values) || []).map(decode);
            }
            return null;
          };

          const toPost = (document0) => {
            const fields = document0.fields || {};
            const post = { id: document0.name.split('/').pop() };
            for (const key in fields) post[key] = decode(fields[key]);
            return post;
          };

          window.__DHG_FIRST_PAGE__ = data.documents.map(toPost);
          window.dispatchEvent(new Event('dhg:first-page'));
        } catch (e) {
          // Best-effort: the app's own query still runs.
        }
      })();
    </script>
